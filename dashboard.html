<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emergency Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="dashboard">

    <h1>📊 Emergency Dashboard</h1>

    <div class="card">
        <h2>🚨 SOS Status</h2>
        <p id="sosStatus">No emergency triggered</p>
    </div>

    <div class="card">
    <h2>📷 Road CCTV Monitoring</h2>

    <div class="cctv-grid">

        <div class="cctv-box">
            <img src="./assets\IMG-20260529-WA0004.jpg"  />
            <p>Main Highway</p>
        </div>

        <div class="cctv-box">
            <img src="./assets\IMG-20260529-WA0004.jpg" />
            <p>City Junction</p>
        </div>

        <div class="cctv-box">
            <img src="./assets\IMG-20260529-WA0004.jpg" />
            <p>Traffic Signal</p>
        </div>

        <div class="cctv-box">
            <img src="./assets\IMG-20260529-WA0004.jpg" />
            <p>Bridge Route</p>
        </div>

    </div>
</div>

    <div class="card">
        <h2>🚑 Services Status</h2>
        <p>Police: Standby</p>
        <p>Ambulance: Standby</p>
        <p>Family: Ready</p>
    </div>

    <div class="card">
    <h2>📡 Emergency Timeline</h2>
    <div id="timeline"></div>
</div>

    <button onclick="window.location.href='index.html'">
        ⬅ Back to Home
    </button>

</div>

<script src="dashboard.js"></script>

</body>
</html>
