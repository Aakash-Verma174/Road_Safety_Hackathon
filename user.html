<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RoadSOS - Emergency Response System</title>
    <link rel="stylesheet" href="./user.css">
</head>

<body>



<div class="container">

    <!-- HEADER -->
    <div class="top-bar">
        🚨 RoadSOS Emergency Response System
    </div>

    <h1>RoadSOS</h1>
    <p class="subtitle">Instant Emergency Assistance at One Tap</p>

    <!-- IMPORTANT INFO -->
    <div class="info-box">
        <p>⚠ This is a safety prototype for hackathon demonstration.</p>
        <p>📍 Always enable location for emergency response.</p>
    </div>

    <!-- MAIN ACTIONS -->
    <div class="action-box">

        <button onclick="sendSOS()" class="sos-btn">🚨 SOS</button>

        <button id="shareBtn">📤 SHARE LOCATION</button>

        <button id="accidentBtn">⚠ SIMULATE ACCIDENT</button>

    </div>

   

    <!-- LOCATION SECTION -->
    <div class="location-box">
        <h2>📍 Live Location</h2>

        <p id="locationText">Location not detected</p>

        <button id="locationBtn">GET CURRENT LOCATION</button>
    </div>


<div id="chatFloatBtn">💬</div>

    <!-- FOOTER -->
    <div class="footer">
        <p>RoadSOS • Hackathon Project • Built for Emergency Safety</p>
    </div>

</div>

<script src="./user.js"></script>

</body>
</html>
